<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Como ser um bom colega · VanBerto’s</title>

<style>
:root {
    --bg: #fffef8;
    --ink: #1b1b1b;
    --muted: #4b5563;
    --brand: #006b5c;
    --brand-2: #0f766e;
    --line: #d9e2df;
    --ok: #7ed957;
    --ok-ink: #14532d;
    --bad: #e5482a;
    --bad-bg: #ffe1d8;
    --shadow: 0 4px 14px rgba(0,0,0,.12);
}

* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 18px 14px 160px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
    text-align: center;
}

.wrap { max-width: 720px; margin: 0 auto; }

h1 {
    margin: 4px 0 2px;
    font-size: clamp(26px, 6vw, 40px);
    line-height: 1.1;
    color: var(--brand);
    letter-spacing: -0.5px;
}

.autor { margin: 0; font-size: 15px; font-weight: bold; color: var(--brand); }

.stripe {
    display: flex;
    height: 8px;
    max-width: 320px;
    margin: 12px auto 14px;
    border-radius: 6px;
    overflow: hidden;
}
.stripe i { flex: 1; }

.descricao { max-width: 600px; margin: 0 auto 14px; font-size: 16px; line-height: 1.45; }

.toolbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 12px; }

.tool-btn {
    background: #fff;
    color: var(--brand);
    border: 2px solid var(--brand);
    border-radius: 12px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    min-height: 40px;
}
.tool-btn:hover { background: #e6f4f1; }

button:focus-visible { outline: 3px solid #1a0da8; outline-offset: 2px; }

/* Progresso */
.progress-bar-container {
    width: 100%;
    background: #e5e7eb;
    height: 16px;
    border-radius: 10px;
    overflow: hidden;
    margin: 0 auto 16px;
}
.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #22c55e, #16a34a);
    transition: width .4s ease;
}

/* VanBerto fixo */

.vb-robot {
    display: block;
    width: 100%;
    height: auto;
    animation: vbFloat 3s ease-in-out infinite;
    filter: drop-shadow(0 0 12px #38bdf8);
    transition: filter .25s ease;
}
.vb-robot.vb-happy  { animation: vbFloat 3s ease-in-out infinite, vbJump .5s ease-out; filter: drop-shadow(0 0 16px #22c55e); }
.vb-robot.vb-sad    { animation: vbFloat 3s ease-in-out infinite, vbShake .4s ease-out; filter: drop-shadow(0 0 16px #f97316); }
.vb-robot.vb-celebrate { animation: vbFloat 3s ease-in-out infinite, vbCelebrate .7s ease-out; filter: drop-shadow(0 0 18px #38bdf8); }



@keyframes vbFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes vbJump { 0% { transform: translateY(0); } 30% { transform: translateY(-14px); } 60% { transform: translateY(0); } 100% { transform: translateY(-4px); } }
@keyframes vbShake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-4px); } }
@keyframes vbCelebrate { 0% { transform: scale(1); } 30% { transform: scale(1.1); } 60% { transform: scale(.98); } 100% { transform: scale(1.02); } }



/* Robô fixo no canto inferior esquerdo */
#fixed-robot-wrap {
    position: fixed;
    right: clamp(.6rem, 2vw, 1.2rem);
    bottom: clamp(.6rem, 2vh, 1.2rem);
    z-index: 70;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    pointer-events: none;
}
#vb-robot { width: clamp(64px, 18vw, 92px); cursor: pointer; pointer-events: auto; }
#vb-robot:focus-visible { outline: 3px solid #1a0da8; outline-offset: 4px; border-radius: 12px; }

#fixed-bubble {
    position: relative;
    max-width: min(210px, 62vw);
    margin: 0 0 12px;
    padding: 8px 12px;
    background: #fff;
    border: 3px solid var(--brand);
    border-radius: 16px;
    box-shadow: 3px 3px 0 var(--brand);
    font-size: clamp(.8rem, 3.4vw, .95rem);
    font-weight: bold;
    line-height: 1.3;
    color: var(--brand);
    text-align: center;
    opacity: 0;
    transform: translateY(6px) scale(.9);
    transition: opacity .3s, transform .3s cubic-bezier(.34,1.56,.64,1);
}
#fixed-bubble.show { opacity: 1; transform: none; }
#fixed-bubble::after {
    content: "";
    position: absolute;
    left: 50%; margin-left: -9px; bottom: -13px;
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-top: 12px solid var(--brand);
}
#fixed-bubble::before {
    content: "";
    position: absolute;
    left: 50%; margin-left: -7px; bottom: -8px;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-top: 9px solid #fff;
    z-index: 1;
}

#fixed-robot-name {
    max-width: 150px;
    padding: 2px 10px;
    background: #fff;
    border: 2px solid var(--brand);
    border-radius: 999px;
    font-size: .8rem;
    font-weight: bold;
    color: var(--brand);
    overflow-wrap: anywhere;
    text-align: center;
    line-height: 1.25;
}

#prof-tag {
    position: fixed;
    bottom: .6rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 60;
    font-size: clamp(.65rem, 1.8vw, .8rem);
    font-weight: bold;
    color: var(--brand);
    white-space: nowrap;
    pointer-events: none;
}

/* Ecrã do nome */
#name-screen { display: none; text-align: center; }
#name-screen .question-text { margin-bottom: 6px; }
#name-screen p.hint { margin: 0 0 14px; color: var(--muted); }
#player-name {
    width: 100%;
    max-width: 360px;
    padding: 12px 14px;
    font: inherit;
    font-size: 18px;
    text-align: center;
    border: 3px solid var(--brand-2);
    border-radius: 14px;
    color: var(--ink);
}
#player-name:focus { outline: 3px solid #1a0da8; outline-offset: 2px; }
#name-screen .btn-restart-panel { display: block; margin: 14px auto 0; min-width: 180px; }

/* Cartão da pergunta */
.panel {
    background: #fff;
    border-radius: 18px;
    padding: 18px;
    box-shadow: var(--shadow);
    text-align: left;
}

.question-label { margin: 0 0 4px; font-size: 14px; color: var(--muted); }
.question-text { margin: 0 0 14px; font-size: clamp(18px, 4.6vw, 22px); font-weight: bold; line-height: 1.3; }

.options { display: flex; flex-direction: column; gap: 10px; }

.option-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 56px;
    padding: 10px 14px;
    font: inherit;
    font-size: 17px;
    line-height: 1.3;
    text-align: left;
    color: var(--ink);
    background: #fff;
    border: 3px solid var(--brand-2);
    border-radius: 16px;
    cursor: pointer;
    transition: background .15s ease, transform .12s ease;
}
.option-btn .num {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--brand-2);
    color: #fff;
    font-weight: bold;
    font-size: 15px;
}
.option-btn .txt { flex: 1 1 auto; }
.option-btn .mark { flex: 0 0 auto; font-size: 20px; }

.option-btn:hover:not(:disabled) { background: #e6f4f1; transform: translateY(-1px); }
.option-btn:disabled { cursor: default; }
.option-btn.correct { background: var(--ok); border-color: #3f9b1f; color: var(--ok-ink); }
.option-btn.correct .num { background: #14532d; }
.option-btn.wrong { background: var(--bad-bg); border-color: var(--bad); }
.option-btn.wrong .num { background: var(--bad); }
.option-btn.dim { opacity: .55; }

/* Explicação */
#explain {
    display: none;
    margin-top: 16px;
    border-radius: 16px;
    overflow: hidden;
    border: 3px solid var(--rule, #ccc);
    background: #fff;
}
#explain.show { display: block; animation: pop .25s ease-out; }
@keyframes pop { from { transform: scale(.97); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.ex-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--rule, #ccc);
    color: var(--rule-ink, #1b1b1b);
    font-weight: bold;
    font-size: 16px;
}
.ex-head .emoji { font-size: 26px; }
.ex-body { padding: 10px 14px 12px; font-size: 16px; line-height: 1.45; }
.ex-body .rule-line { display: block; margin-top: 8px; font-size: 14px; color: var(--muted); }
.ex-body .verdict { display: block; font-weight: bold; margin-bottom: 4px; font-size: 18px; }

.next-btn, .btn-restart-panel {
    margin-top: 14px;
    background: var(--brand-2);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 12px 22px;
    font: inherit;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    min-height: 48px;
}
.next-btn { display: none; margin-left: auto; }
.next-btn.show { display: block; }
.next-btn:hover, .btn-restart-panel:hover { background: var(--brand); }

#score { margin-top: 12px; font-size: 15px; color: var(--muted); }

/* Final */
#final { display: none; text-align: center; }
#final.show { display: block; }
.stars { font-size: 44px; letter-spacing: 6px; margin: 4px 0 6px; }
.final-message { font-size: 20px; font-weight: bold; margin: 0 0 4px; }
.final-score { margin: 0 0 14px; color: var(--muted); }
.review-title { margin: 14px 0 8px; font-size: 16px; font-weight: bold; }
.chips { display: flex; flex-direction: column; gap: 6px; text-align: left; }
.chip {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    border-radius: 10px;
    background: var(--c);
    color: var(--ink);
    font-size: 15px;
}
.chip.dark-ink { color: #fff; }
.chip .emoji { font-size: 20px; }
.chip .name { flex: 1 1 auto; font-weight: bold; }
.chip .st { flex: 0 0 auto; background: #fff; color: var(--ink); border-radius: 999px; padding: 2px 10px; font-size: 14px; font-weight: bold; }

.confetti { position: fixed; top: -30px; z-index: 50; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: .9; } }

@media (max-width: 560px) {
    body { padding: 12px 10px 150px; }
    .toolbar { gap: 6px; }
    #prof-tag { left: .8rem; transform: none; }
    .tool-btn { white-space: nowrap; padding: 8px 8px; font-size: 13px; }
    .panel { padding: 14px; }
    .option-btn { font-size: 16px; }
    .next-btn { width: 100%; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<body>
<div class="wrap">

<h1>Como ser um bom colega</h1>
<p class="autor">Professora Vanda Várzea</p>
<div class="stripe" id="stripe" aria-hidden="true"></div>

<p class="descricao">
    Lê a situação com atenção e escolhe a melhor resposta. O VanBerto’s vai reagir às tuas escolhas! 🤖💚
</p>

<div class="toolbar">
    <button class="tool-btn" id="sound-btn" type="button" aria-pressed="false">🔊 Som ligado</button>
    <button class="tool-btn" type="button" onclick="startGame()">🔄 Reiniciar jogo</button>
    <button class="tool-btn" type="button" id="name-btn">✏️ Mudar nome</button>
</div>

<div class="progress-bar-container" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress">
    <div class="progress-bar" id="progress-fill"></div>
</div>

<div class="panel" id="game-panel">
    <div id="name-screen">
        <p class="question-text">Como te chamas?</p>
        <p class="hint">Escreve o teu nome para o VanBerto’s te conhecer.</p>
        <input id="player-name" type="text" maxlength="20" placeholder="O teu nome" autocomplete="off" aria-label="O teu nome">
        <button class="btn-restart-panel" id="start-btn" type="button">Começar ▶</button>
    </div>

    <div id="quiz">
        <p class="question-label" id="question-counter">Pergunta 1 de 15</p>
        <p class="question-text" id="question-text"></p>

        <div class="options" id="options"></div>

        <div id="explain" aria-live="polite">
            <div class="ex-head"><span class="emoji" id="ex-emoji"></span><span id="ex-name"></span></div>
            <div class="ex-body"><span class="verdict" id="ex-verdict"></span><span id="ex-text"></span><span class="rule-line" id="ex-rule"></span></div>
        </div>

        <button class="next-btn" id="next-btn" type="button">Seguinte ▶</button>
        <div id="score">Pontuação: 0</div>
    </div>

    <div id="final" aria-live="polite"></div>
</div>

</div>

<div id="prof-tag">© Prof.ª Vanda Várzea</div>

<div id="fixed-robot-wrap">
    <div id="fixed-bubble" aria-live="polite"></div>
    <canvas class="vb-robot" id="vb-robot" width="96" height="96" role="button" tabindex="0" aria-label="VanBerto’s — clica para falar"></canvas>
    <div id="fixed-robot-name">👤 Colega</div>
</div>

<script>
/* ------------------ REGRAS DO CARTAZ ------------------- */
const RULES = [
    { e: "👋", n: "Cumprimentar os colegas e professores", d: "começar o dia com amizade e respeito.", c: "#ff6b2c" },
    { e: "😊", n: "Ser simpático com todos",               d: "evitar conflitos e ajudar quem precisa.", c: "#e395c0" },
    { e: "🎒", n: "Vir preparado para aprender",           d: "trazer cadernos, lápis e muita vontade.", c: "#8c96ff" },
    { e: "✋", n: "Levantar a mão para partilhar ideias",  d: "todos merecem ser ouvidos.", c: "#c3fb6d" },
    { e: "🧹", n: "Manter a sala e o recreio limpos",      d: "não deixar lixo no chão.", c: "#0399b5" },
    { e: "💻", n: "Usar computadores e tablets de forma responsável", d: "seguir as instruções da professora.", c: "#ffdd2d" },
    { e: "🤝", n: "Ajudar os colegas",                     d: "partilhar ideias e colaborar nos trabalhos de grupo, porque juntos aprendemos mais.", c: "#7ed957" },
    { e: "⏰", n: "Chegar a horas",                        d: "cumprir horários e tarefas.", c: "#0bc1e0" },
    { e: "📣", n: "Ser honesto e pedir ajuda quando preciso", d: "a verdade torna-nos mais fortes.", c: "#1a0da8", dark: true }
];

/* r = índice da regra; right = resposta certa; wrong = duas erradas */
const questionsData = [
    { r: 0, text: "Chegas à escola e encontras a funcionária à porta. O que fazes?",
      right: "Dizes “Bom dia!” com um sorriso.",
      wrong: ["Passas sem dizer nada, porque tens pressa.", "Só cumprimentas os teus amigos."],
      why: "Cumprimentar todos, e não só os amigos, mostra respeito." },
    { r: 0, text: "Um colega que não conheces bem entra na sala. O que fazes?",
      right: "Dizes “Olá!” e sorris.",
      wrong: ["Esperas que ele diga primeiro.", "Finges que não o vês."],
      why: "Começar com um “Olá” faz qualquer pessoa sentir-se bem-vinda." },
    { r: 0, text: "A aula acabou e vais sair da sala. O que faz um bom colega?",

    { r: 3, text: "A professora está a explicar e tu queres falar. O que deves fazer?",

let audioCtx = null;
let soundOn = true;

function initAudio() {
    if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}

function playTone(freq, time, duration, type = "square", vol = 0.2) {
    if (!soundOn || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const t0 = audioCtx.currentTime + time;
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + duration);
}

function soundCorrect() { initAudio(); playTone(900, 0, .10); playTone(1200, .10, .10); playTone(1500, .20, .14); }
function soundWrong()   { initAudio(); playTone(260, 0, .16, "square", .25); playTone(180, .16, .20, "square", .25); }
function soundWin()     { initAudio(); playTone(700, 0, .16); playTone(900, .18, .16); playTone(1100, .36, .20); playTone(1400, .60, .28); }

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }

}

const vbCtx = vbRobot.getContext("2d");
const DPR = Math.min(window.devicePixelRatio || 1, 3);
vbRobot.width = 96 * DPR;
vbRobot.height = 96 * DPR;
vbCtx.scale(DPR, DPR);
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

let vbMode = null;      // null | "happy" | "sad" | "celebrate"
let vbBusy = false;

function vbDraw(blink, step) {
    if (vbMode === "happy" || vbMode === "celebrate") drawVBAtual(vbCtx, "happy", -1, true);
    else if (vbMode === "sad") drawVBAtual(vbCtx, "sad", -1, false);
    else drawVBAtual(vbCtx, blink || false, step === undefined ? -1 : step, false);
}

function resetRobotClasses() {
    vbRobot.classList.remove("vb-happy", "vb-sad", "vb-celebrate");
}

function setRobot(cls) {
    resetRobotClasses();
    void vbRobot.offsetWidth;          // reinicia a animação
    if (cls) vbRobot.classList.add(cls);
    vbMode = cls === "vb-happy" ? "happy" : cls === "vb-sad" ? "sad" : cls === "vb-celebrate" ? "celebrate" : null;
    vbDraw(false);
}

function vbBlink() {
    if (vbBusy || vbMode) return;
    vbDraw(true);
    setTimeout(() => { if (!vbBusy && !vbMode) vbDraw(false); }, 180);
}

function vbWalk(steps, speed) {
    steps = steps || 6; speed = speed || 170;
    if (vbBusy || vbMode) return;
    vbBusy = true;
    let i = 0;
    const iv = setInterval(() => {
        if (vbMode) { clearInterval(iv); vbBusy = false; return; }
        vbDraw(false, i % 2 === 0 ? 0 : 1);
        i++;
        if (i >= steps) { clearInterval(iv); vbDraw(false); vbBusy = false; }
    }, speed);
}

vbDraw(false);
setInterval(() => {
    if (vbBusy || vbMode || document.hidden || REDUCED) return;
    if (Math.random() < 0.35) vbWalk(); else vbBlink();
}, 3600);

function setProgress(done) {
    const pct = Math.round((done / totalQuestions) * 100);
    progressFill.style.width = pct + "%";
    progressEl.setAttribute("aria-valuenow", String(pct));
}

function updateScore() { scoreEl.textContent = "Pontuação: " + score; }

/* Escolhe 15 de 27 perguntas, garantindo que todas as regras aparecem */
function buildQuestions() {
    const guaranteed = [];
    const rest = [];
    RULES.forEach((_, r) => {
        const list = shuffle(questionsData.filter(q => q.r === r));
        guaranteed.push(list[0]);
        rest.push(...list.slice(1));
    });
    const chosen = guaranteed.concat(shuffle(rest).slice(0, totalQuestions - guaranteed.length));
    return shuffle(chosen).map(q => ({
        r: q.r,
        text: q.text,
        why: q.why,
        options: shuffle([{ t: q.right, ok: true }, { t: q.wrong[0], ok: false }, { t: q.wrong[1], ok: false }])
    }));
}

/* ------------------ JOGO ------------------- */
function startGame() {
    questions = buildQuestions();
    currentIndex = 0;
    score = 0;
    results = {};
    answered = false;

    finalEl.classList.remove("show");
    finalEl.innerHTML = "";
    nameScreen.style.display = "none";
    quizEl.style.display = "block";

    setRobot(null);
    updateScore();
    setProgress(0);
    say("Olá, " + playerName + "! Vamos ver que bom colega tu és?");
    showQuestion();
}

function showQuestion() {
    const q = questions[currentIndex];
    answered = false;

    questionTextEl.textContent = q.text;
    questionCounterEl.textContent = "Pergunta " + (currentIndex + 1) + " de " + totalQuestions;

    optionsEl.innerHTML = "";
    q.options.forEach((o, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn";
        btn.innerHTML = '<span class="num">' + (i + 1) + '</span><span class="txt"></span><span class="mark" aria-hidden="true"></span>';
        btn.querySelector(".txt").textContent = o.t;
        btn.addEventListener("click", () => handleAnswer(i));
        optionsEl.appendChild(btn);
    });

    explainEl.classList.remove("show");
    nextBtn.classList.remove("show");

    if (currentIndex > 0) { setRobot(null); sayPick(PHRASES.intro); }
}

function handleAnswer(index) {
    if (answered) return;
    answered = true;
    initAudio();

    const q = questions[currentIndex];
    const rule = RULES[q.r];
    const btns = Array.from(optionsEl.children);
    const correctIndex = q.options.findIndex(o => o.ok);
    const isRight = index === correctIndex;

    btns.forEach((b, i) => {
        b.disabled = true;
        if (i !== index && i !== correctIndex) b.classList.add("dim");
    });

    results[q.r] = results[q.r] || { ok: 0, total: 0 };
    results[q.r].total++;

    const verdict = $("ex-verdict");

    if (isRight) {
        score++;
        results[q.r].ok++;
        btns[index].classList.add("correct");
        btns[index].querySelector(".mark").textContent = "✔";
        verdict.textContent = "✔️ Muito bem! Essa é a atitude de um bom colega!";
        setRobot("vb-happy");
        sayPick(PHRASES.happy);
        soundCorrect();
    } else {
        btns[index].classList.add("wrong");
        btns[index].querySelector(".mark").textContent = "✖";
        btns[correctIndex].classList.add("correct");
        btns[correctIndex].querySelector(".mark").textContent = "✔";
        verdict.textContent = "❌ Ups! Um bom colega faria a opção " + (correctIndex + 1) + ".";
        setRobot("vb-sad");
        sayPick(PHRASES.sad);
        soundWrong();
    }

    updateScore();
    setProgress(currentIndex + 1);

    explainEl.style.setProperty("--rule", rule.c);
    explainEl.style.setProperty("--rule-ink", rule.dark ? "#fff" : "#1b1b1b");
    $("ex-emoji").textContent = rule.e;
    $("ex-name").textContent = rule.n;
    $("ex-text").textContent = q.why;
    $("ex-rule").textContent = "Do cartaz: " + rule.n + " – " + rule.d;
    explainEl.classList.add("show");

    nextBtn.textContent = (currentIndex + 1 < totalQuestions) ? "Seguinte ▶" : "Ver resultado 🏆";
    nextBtn.classList.add("show");
    nextBtn.focus({ preventScroll: false });
}

nextBtn.addEventListener("click", () => {
    if (!answered) return;
    currentIndex++;
    if (currentIndex < totalQuestions) {
        showQuestion();
        window.scrollTo({ top: 0, behavior: "smooth" });
    } else {
        endGame();
    }
});

/* Teclas 1, 2, 3 */
document.addEventListener("keydown", e => {
    if (answered || quizEl.style.display === "none" || e.target.tagName === "INPUT") return;
    if (["1", "2", "3"].includes(e.key)) handleAnswer(Number(e.key) - 1);
});

function confetti() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const icons = ["🎉", "⭐", "💚", "✨", "🌟"];
    for (let i = 0; i < 36; i++) {
        const s = document.createElement("span");
        s.className = "confetti";
        s.textContent = icons[i % icons.length];
        s.style.left = Math.random() * 100 + "vw";
        s.style.fontSize = (16 + Math.random() * 16) + "px";
        s.style.animationDuration = (2 + Math.random() * 2) + "s";
        s.style.animationDelay = (Math.random() * 0.8) + "s";
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 5000);
    }
}

function endGame() {
    quizEl.style.display = "none";
    setRobot("vb-celebrate");
    setProgress(totalQuestions);
    soundWin();

    const ratio = score / totalQuestions;
    const starCount = ratio >= 0.9 ? 3 : ratio >= 0.6 ? 2 : 1;
    const stars = "⭐".repeat(starCount) + "☆".repeat(3 - starCount);

    let msg;
    if (score === totalQuestions) msg = "🏆 Fantástico, " + esc(playerName) + "! Foste um excelente colega em todas as situações!";
    else if (ratio >= 0.6)        msg = "🎉 Muito bem, " + esc(playerName) + "! Foste um bom colega na maioria das situações!";
    else                          msg = "😊 Terminaste, " + esc(playerName) + "! Continua a praticar e vais ser um ótimo colega!";

    say(score === totalQuestions ? "Uau, " + playerName + "! Pontuação perfeita!" : "Obrigado por jogares comigo, " + playerName + "!");

    const chips = RULES.map((r, i) => {
        const res = results[i];
        if (!res) return "";
        const good = res.ok === res.total;
        return '<div class="chip' + (r.dark ? " dark-ink" : "") + '" style="--c:' + r.c + '">' +
               '<span class="emoji">' + r.e + '</span><span class="name">' + r.n + '</span>' +
               '<span class="st">' + (good ? "✔ " : "↻ ") + res.ok + "/" + res.total + '</span></div>';
    }).join("");

    finalEl.innerHTML =
        '<div class="stars" aria-label="' + starCount + ' de 3 estrelas">' + stars + '</div>' +
        '<p class="final-message">' + msg + '</p>' +
        '<p class="final-score">Acertaste em ' + score + ' de ' + totalQuestions + ' situações.</p>' +
        '<p class="review-title">As regras do cartaz</p>' +
        '<div class="chips">' + chips + '</div>' +
        '<button class="btn-restart-panel" type="button" onclick="startGame()">Jogar outra vez</button>';
    finalEl.classList.add("show");

    confetti();
}


/* ------------------ NOME DO JOGADOR ------------------- */
function showNameScreen() {
    quizEl.style.display = "none";
    finalEl.classList.remove("show");
    finalEl.innerHTML = "";
    nameScreen.style.display = "block";
    nameInput.value = playerName === "Colega" ? "" : playerName;
    answered = true;               // bloqueia as teclas 1-3
    setRobot(null);
    setProgress(0);
    say("Olá! Eu sou o VanBerto\u2019s. Como te chamas?");
    nameInput.focus();
}

function confirmName() {
    playerName = nameInput.value.trim().replace(/\s+/g, " ") || "Colega";
    nameLabel.textContent = "\uD83D\uDC64 " + playerName;
    startGame();
}

$("start-btn").addEventListener("click", () => { initAudio(); confirmName(); });
nameInput.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); initAudio(); confirmName(); } });
$("name-btn").addEventListener("click", showNameScreen);

/* Clicar no robô: ele fala e salta */
const TALK = ["Um bom colega sorri e ajuda! \uD83D\uDE0A", "Levanta a m\u00e3o e espera a tua vez! \u270B", "Juntos aprendemos mais! \uD83E\uDD1D", "Diz sempre a verdade! \uD83D\uDCE3", "Mant\u00e9m a sala limpa! \uD83E\uDDF9"];
function vbTalk() {
    if (vbMode) return;
    resetRobotClasses(); void vbRobot.offsetWidth; vbRobot.classList.add("vb-happy");
    vbMode = "happy"; vbDraw(false);
    say(pick(TALK));
    setTimeout(() => { if (vbMode === "happy") setRobot(null); }, 800);
}
vbRobot.addEventListener("click", vbTalk);
vbRobot.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); vbTalk(); } });

/* Iniciar */
showNameScreen();
</script>
